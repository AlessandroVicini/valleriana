<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gioco di strategia nella Valleriana del Duecento: dieci casate si contendono le castella.">
<meta name="theme-color" content="#8A4A22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Signori della Valleriana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: mappa acquerellata della valle a sinistra, registro del castello a destra, cronaca in fondo */
:root{
  --paper:#ECEEE4; --paper-2:#E1E5D6; --card:#F7F8F2; --ink:#26271F; --ink-2:#5A5D4C; --rule:#C6CBB6;
  --accent:#8A4A22; --accent-ink:#FFF8F0; --accent-soft:#F1E3D6;
  --river:#557A9C; --h1:#D9E1A6; --h2:#A9C47A; --h3:#6E9A5E; --h4:#46774B;
  --stone:#AFA999; --stone-2:#857F71; --wood:#7A4E2A;
  --c0:#B3362A; --c1:#2C5FA0; --c2:#B07F0A; --c3:#6A3E8C; --c4:#1F7A72; --c5:#C25E14; --c6:#A33470; --c7:#1E3566; --c8:#7A4E2A; --c9:#2B2B2B; --fn:#8C8E82;
  --good:#3E7A3C; --warn:#A8730F; --bad:#A3322A;
  --display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --display-lc:"IM Fell English","Iowan Old Style",Georgia,serif;
  --body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#191B15; --paper-2:#22251D; --card:#24281F; --ink:#E6E8DC; --ink-2:#A8AC98; --rule:#3B4033;
  --accent:#D3905A; --accent-ink:#1B130C; --accent-soft:#3A2B1E;
  --river:#7FA6C9; --h1:#3D4A2A; --h2:#34502F; --h3:#2B4A2F; --h4:#203B27;
  --stone:#7A766C; --stone-2:#5A564F; --wood:#8C5C34;
  --c0:#E2604F; --c1:#4FA3F0; --c2:#E2B33E; --c3:#B184DA; --c4:#4FC0B2; --c5:#F08A3E; --c6:#E26BA6; --c7:#8D9BDB; --c8:#C08A5A; --c9:#D8D8D0; --fn:#8D9084;
  --good:#7BBA6E; --warn:#DDAA4A; --bad:#E26A5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#191B15; --paper-2:#22251D; --card:#24281F; --ink:#E6E8DC; --ink-2:#A8AC98; --rule:#3B4033;
  --accent:#D3905A; --accent-ink:#1B130C; --accent-soft:#3A2B1E;
  --river:#7FA6C9; --h1:#3D4A2A; --h2:#34502F; --h3:#2B4A2F; --h4:#203B27;
  --stone:#7A766C; --stone-2:#5A564F; --wood:#8C5C34;
  --c0:#E2604F; --c1:#4FA3F0; --c2:#E2B33E; --c3:#B184DA; --c4:#4FC0B2; --c5:#F08A3E; --c6:#E26BA6; --c7:#8D9BDB; --c8:#C08A5A; --c9:#D8D8D0; --fn:#8D9084;
  --good:#7BBA6E; --warn:#DDAA4A; --bad:#E26A5C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;max-width:1280px;margin:0 auto 12px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,3.2vw,2.1rem);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand .sub{display:block;margin-top:4px;color:var(--ink-2);font-size:.9rem}
.brand .sub b{font-weight:700;color:var(--ink)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.when{display:flex;flex-direction:column;gap:4px}
.when .lbl{font-family:var(--display-lc);font-size:1.15rem;line-height:1}
.seasons{display:flex;gap:3px}
.seasons i{display:block;width:22px;height:5px;border-radius:2px;background:var(--rule)}
.seasons i.on{background:var(--accent)}
.purse{display:flex;flex-direction:column}
.purse .lbl,.k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.purse b{font-size:1.25rem;font-weight:700}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;padding:9px 16px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--rule))}
.btn:disabled{opacity:.45;cursor:not-allowed}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1280px;margin:0 auto}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 410px;align-items:start}
  .panel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.mapwrap{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
#map{width:100%;max-width:620px;height:auto;max-height:84vh;display:block;touch-action:manipulation}
.banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:2;background:var(--ink);color:var(--paper);padding:7px 12px;border-radius:6px;font-size:.9rem;display:flex;gap:10px;align-items:center;max-width:calc(100% - 16px)}
.banner button{background:transparent;border:1px solid currentColor;border-radius:4px;padding:2px 8px;color:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.85rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block;border:1px solid var(--ink)}
.legend .me{color:var(--ink);font-weight:700}

.node{cursor:pointer}
.node .lbl{font-family:var(--display);font-size:12.5px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
.node .badge{font-family:var(--body);font-size:9.5px;font-weight:700;fill:var(--paper)}
.node:hover .tower{filter:brightness(1.15)}
.ring-target{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.35}}
.siegering{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring-target,.siegering{animation:none}}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 18px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.ph h2{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.05;margin:0}
.ph .kind{color:var(--ink-2);font-size:.85rem;font-style:italic;font-family:var(--display-lc)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--rule);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 4px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.1rem}
.meter{height:5px;background:var(--paper-2);border-radius:3px;overflow:hidden;margin-top:3px}
.meter span{display:block;height:100%}
.sec{border-top:1px solid var(--rule);padding-top:12px;margin-top:12px}
.sec h3{font-family:var(--display);font-weight:400;font-size:1.05rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3 small{font-family:var(--body);font-size:.8rem;color:var(--ink-2)}
.stores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fore{font-size:.85rem;color:var(--ink-2);margin:8px 0 0}
.fore b.pos{color:var(--good)} .fore b.neg{color:var(--bad)}
.jobs{display:grid;gap:5px}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;font-size:.92rem}
.job .w{color:var(--ink-2);font-size:.8rem;min-width:52px;text-align:right}
.job .pct{min-width:38px;text-align:right;font-weight:700}
.step{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.step button{width:28px;height:26px;border:0;background:var(--paper-2);font-weight:700;line-height:1}
.step button+button{border-left:1px solid var(--rule)}
.step button:hover{background:var(--accent-soft)}
.idle{font-size:.82rem;color:var(--warn);margin-top:4px}
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;padding:6px 6px;font-size:.85rem;min-width:0}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.row2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}
.row2 .k{white-space:nowrap}
.units{display:grid;gap:6px}
.unit{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.unit .cost{font-size:.78rem;color:var(--ink-2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bar{height:7px;background:var(--paper-2);border-radius:4px;overflow:hidden;margin:6px 0}
.bar span{display:block;height:100%;background:var(--accent)}
.note{font-size:.88rem;color:var(--ink-2);margin:6px 0 0}
.alert{border:1px solid color-mix(in srgb,var(--bad) 40%,var(--rule));background:color-mix(in srgb,var(--bad) 8%,var(--card));border-radius:8px;padding:10px 12px;margin-top:10px;font-size:.9rem}
.alert.mine{border-color:color-mix(in srgb,var(--accent) 45%,var(--rule));background:var(--accent-soft)}

.chron{max-width:1280px;margin:18px auto 0;border-top:1px solid var(--rule);padding-top:12px}
.chron h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0 0 8px}
#log{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-width:75ch;max-height:260px;overflow:auto}
#log li{font-size:.9rem;display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px}
#log li .t{color:var(--ink-2);font-family:var(--display-lc);font-style:italic}
#log li.war span:last-child{color:var(--bad)}
#log li.good span:last-child{color:var(--good)}

.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:20px 20px 18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.card h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0 0 6px;line-height:1.1;text-wrap:balance}
.card p{margin:6px 0}
.card .lead{color:var(--ink-2)}
.houses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 6px}
@media (max-width:480px){.houses{grid-template-columns:1fr}.stats,.stores{grid-template-columns:repeat(2,minmax(0,1fr))}}
.house{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:9px 11px;display:grid;gap:2px}
.snd{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;padding:6px 10px}
.snd::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.snd[aria-pressed="false"]{color:var(--ink-2)}
.snd[aria-pressed="false"]::before{background:var(--rule)}
.house:hover{border-color:var(--accent)}
.house strong{font-family:var(--display);font-weight:400;font-size:1.2rem;display:flex;align-items:center;gap:8px}
.house strong i{width:12px;height:12px;border-radius:2px;border:1px solid var(--ink)}
.house span{font-size:.86rem;color:var(--ink-2)}
.mv{display:grid;gap:10px;margin:12px 0}
.mv label{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center}
.mv input[type=range]{width:100%;accent-color:var(--accent)}
.mv output{text-align:right;font-weight:700}
.est{font-size:.9rem;background:var(--paper-2);border-radius:6px;padding:8px 10px}
.mkt{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem}
.mkt th,.mkt td{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:left}
.mkt td.r,.mkt th.r{text-align:right}
.report{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.report li{font-size:.93rem;padding-left:12px;border-left:3px solid var(--rule)}
.report li.war{border-color:var(--bad)} .report li.good{border-color:var(--good)}
.council{max-width:1280px;margin:0 auto 14px;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.adv{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:3px 14px 3px 3px;position:relative;text-align:left}
.adv:hover{border-color:var(--accent)}
.adv svg{width:42px;height:42px;flex:none}
.adv .nm{display:flex;flex-direction:column;line-height:1.15}
.adv .nm b{font-family:var(--display);font-weight:400;font-size:1rem}
.adv .nm small{font-size:.75rem;color:var(--ink-2)}
.adv .dot{position:absolute;top:1px;left:33px;width:13px;height:13px;border-radius:50%;border:2px solid var(--card)}
.advcard{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:start}
.advcard svg{width:120px;height:120px}
@media (max-width:480px){.advcard{grid-template-columns:1fr}.advcard svg{width:92px;height:92px}}
.quote{font-family:var(--display-lc);font-style:italic;font-size:1.1rem;margin:6px 0 0}
.says{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}
.says li{padding:8px 10px;border-radius:6px;background:var(--paper-2);border-left:4px solid var(--rule);font-size:.93rem;display:flex;gap:10px;justify-content:space-between;align-items:center}
.says li.bad{border-color:var(--bad)} .says li.warn{border-color:var(--warn)} .says li.ok{border-color:var(--good)}
.says li button{flex:none;padding:3px 9px;font-size:.8rem}
.tip{display:flex;gap:10px;align-items:center;background:var(--paper-2);border-radius:8px;padding:8px 10px;margin:10px 0;font-size:.92rem}
.tip svg{width:46px;height:46px;flex:none}

.battle{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;gap:8px;overflow:auto;
  padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.bhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;max-width:1100px;width:100%;margin:0 auto}
.bhead h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0}
.forces{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.force{display:grid;gap:3px;min-width:140px}
.force .meter{height:7px}
.bstage{display:flex;justify-content:center;min-height:0}
#bcv{width:100%;max-width:min(1100px,calc((100vh - 190px)*900/560));aspect-ratio:900/560;height:auto;border-radius:8px;border:1px solid var(--rule);touch-action:none;background:var(--h1);cursor:crosshair;display:block}
.bctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bctl .btn{padding:6px 10px;font-size:.88rem}
.bhint{text-align:center;font-size:.85rem;color:var(--ink-2);margin:0 auto;max-width:80ch}
.dps{display:grid;gap:10px;margin:12px 0}
.dp,.slot{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--paper)}
.dph{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.dph i{width:11px;height:11px;border-radius:2px;border:1px solid var(--ink);display:inline-block}
.dph .k{text-transform:none;letter-spacing:0;font-size:.82rem}
.dp .actions{margin-top:8px}
.dp .btn,.slot .btn{padding:5px 10px;font-size:.85rem}
.slot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.slot .actions{margin:0}
.badge{display:inline-block;font-family:var(--body);font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin-left:6px;vertical-align:middle}
.badge.h{background:var(--ink);color:var(--paper)}
.choices{display:grid;gap:8px;margin-top:14px}
.choices .btn{text-align:left}
.card h3{font-family:var(--display);font-weight:400;font-size:1.1rem;margin:16px 0 6px}
.tgl{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:.92rem}
.tgl input{accent-color:var(--accent);width:18px;height:18px}
textarea{font:inherit;font-size:.8rem;width:100%;min-height:64px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);padding:8px;margin-top:6px}
input[type=file]{font-size:.85rem;max-width:100%}
select{font:inherit;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);max-width:100%}
</style>

</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Signori della Valleriana</h1>
    <span class="sub" id="who"></span>
  </div>
  <div class="status">
    <div class="when"><span class="lbl num" id="when"></span><span class="seasons" id="seasons"></span></div>
    <div class="purse"><span class="lbl">Tesoro</span><b class="num" id="denari"></b></div>
    <button class="btn primary" id="endBtn" type="button">Fine stagione</button>
    <button class="btn ghost snd" id="musBtn" type="button" aria-pressed="true">Musica</button>
    <button class="btn ghost snd" id="fxBtn" type="button" aria-pressed="true">Effetti</button>
    <button class="btn ghost" id="newBtn" type="button">Partite</button>
  </div>
</header>

<nav class="council" id="council" aria-label="Consiglieri"></nav>

<main class="layout">
  <section class="mapwrap">
    <div class="banner" id="banner" hidden></div>
    <svg id="map" viewBox="-14 0 428 578" role="img" aria-label="Mappa della Valleriana">
      <defs>
        <filter id="wc" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="11"/>
          <feDisplacementMap in="SourceGraphic" scale="26" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="1.4"/>
        </filter>
        <filter id="wc2" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="4"/>
          <feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <g id="land"></g>
      <g id="roads"></g>
      <g id="nodes"></g>
    </svg>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<section class="chron">
  <h2>Cronaca</h2>
  <ol id="log"></ol>
</section>

<div class="battle" id="battle" hidden>
  <div class="bhead"><h2 id="btitle"></h2><div class="forces" id="bforces"></div><span class="num k" id="btime"></span></div>
  <div class="bstage"><canvas id="bcv" width="900" height="560" aria-label="Campo di battaglia"></canvas></div>
  <div class="bctl" id="bctl"></div>
  <p class="bhint" id="bhint"></p>
</div>

<div class="modal" id="modal" hidden><div class="card" id="mcard" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
const $=s=>document.querySelector(s);

const lossTxt=l=>{const p=[];if(l.f)p.push(`${l.f} fanti`);if(l.b)p.push(`${l.b} balestrieri`);if(l.c)p.push(`${l.c} cavalieri`);return p.length?p.join(', '):'nessuno'};

/* ---------- game setup ---------- */

/* ---------- economy ---------- */
function prod(p,id,s){
  const d=PL[id],w=Math.round(p.pop),a=p.alloc,k=x=>w*a[x]/100;
  if(p.siege)return{food:0,grain:0,chest:0,flockFood:0,wood:0,stone:0,work:0,flockTo:p.flock*.92};
  const bl=p.bld||{},grain=k('campi')*d.gr*YIELD.campi[s]*(bl.mulino?1.2:1), chest=k('castagni')*d.ca*YIELD.castagni[s]*(bl.metato?1.25:1);
  const cap=k('pascolo')*6*d.pa;let flockTo=p.flock+(cap-p.flock)*(s===3?.1:.3);if(s===3)flockTo*=.95;
  const flockFood=p.flock*.1, wood=k('bosco')*d.bo*(s===3?.5:.8), stone=k('cava')*d.st*(s===3?.3:.5);
  const work=p.proj?k('edil')*.5:0;
  return{food:grain+chest+flockFood,grain,chest,flockFood,wood,stone,work,flockTo};
}
function resolvePlace(id){
  const p=S.places[id],r=prod(p,id,S.season),mine=isHuman(p.owner);
  const am=(p.owner>=0&&S.factions[p.owner].role==='ai')?Dz().aiProd:1;
  p.food+=r.food*am;p.wood+=r.wood*am;p.stone+=r.stone*am;p.flock=r.flockTo;
  if(p.bq&&!p.siege){p.bld[p.bq]=true;if(mine)addLog(`A ${PL[id].n} è pronto il ${BUILD[p.bq].n.toLowerCase()}.`,'good');p.bq=null}
  if(p.bld&&p.bld.chiesa)p.happy=clamp(p.happy+2,0,100);
  if(p.proj){p.proj.prog+=r.work;if(p.proj.prog>=WALL[p.proj.lvl].work){p.walls=p.proj.lvl;p.proj=null;if(mine)addLog(`Terminate le mura di livello ${ROMAN[p.walls]} a ${PL[id].n}.`,'good')}}
  const need=p.pop*EAT*RATION[p.ration].m;let hd=RATION[p.ration].h,fed=true;
  if(p.food>=need)p.food-=need;
  else{const f=(need-p.food)/need;p.food=0;fed=false;p.pop*=1-.25*f;hd-=3+15*f;if(mine)addLog(`Fame a ${PL[id].n}: il granaio è vuoto e la gente muore o fugge.`,'war')}
  if(p.owner>=0){S.factions[p.owner].denari+=p.pop*TAX[p.tax].r*(S.factions[p.owner].role==='ai'?Dz().aiTax:1);hd+=TAX[p.tax].h}
  hd+=(50-p.happy)*.05;if(p.siege)hd-=4;
  p.happy=clamp(p.happy+hd,0,100);
  if(fed&&p.happy>=45)p.pop*=1+(S.season===0?.03:.012);else if(p.happy<30)p.pop*=.99;
  p.pop=Math.max(15,p.pop);
}
function recruit(fi,id,u,n){
  const p=S.places[id],U=UNITS[u],F=S.factions[fi],c=unitCost(id,u);
  if(F.denari<c*n||p.wood<U.wood*n||p.pop-n<40||p.siege)return false;
  F.denari-=c*n;p.wood-=U.wood*n;p.pop-=n;p.army[u]+=n;p.happy=clamp(p.happy-1,0,100);return true;
}
function startWall(id){const p=S.places[id];if(p.proj||p.walls>=3)return false;const W=WALL[p.walls+1];
  if(p.stone<W.stone||p.wood<W.wood)return false;p.stone-=W.stone;p.wood-=W.wood;p.proj={lvl:p.walls+1,prog:0};return true}

/* ---------- war ---------- */
function retreat(army,fi,from,silent){
  if(tot(army)===0)return;
  const home=ADJ[from].find(n=>S.places[n].owner===fi&&!S.places[n].siege);
  if(home){const h=S.places[home].army;h.f+=army.f;h.b+=army.b;h.c+=army.c}
  else if(!silent)addLog(`Senza un castello dove ripiegare, i superstiti dei ${S.factions[fi].name} si disperdono.`,'war');
}
function capture(id,fi,army){
  const p=S.places[id],prev=p.owner;
  if(p.siege&&p.siege.by!==fi){retreat(p.siege.army,p.siege.by,id,true)}
  p.owner=fi;p.army=army;p.siege=null;p.pop*=.88;p.happy=30;p.proj=null;p.bq=null;p.tax=1;p.ration=1;p.alloc={...DEF_ALLOC};addAtt(prev,fi,-25);
  addLog(`${PL[id].n} cade: ora è dei ${S.factions[fi].name}${prev>=0?`, tolta ai ${S.factions[prev].name}`:''}.`,(fi===S.player)?'good':(prev===S.player?'war':''));
}
function assault(fi,army,id){
  const p=S.places[id],def=p.owner;
  const A=attStr(army)*rnd(.85,1.15),D=defense(p)*rnd(.85,1.15);
  const res={win:A>D,place:PL[id].n,def};
  if(A>D){res.aL=lose(army,clamp(.12+.5*D/A,.1,.8));res.dL={...p.army};p.army={f:0,b:0,c:0};capture(id,fi,army)}
  else{res.aL=lose(army,rnd(.5,.7));res.dL=lose(p.army,clamp(.45*A/D,0,.6));addAtt(def,fi,-15);
    addLog(`I ${S.factions[fi].name} assaltano ${PL[id].n} e vengono respinti.`,(def===S.player)?'good':(fi===S.player?'war':''));retreat(army,fi,id)}
  return res;
}
function startSiege(fi,army,id){
  const p=S.places[id];p.siege={by:fi,army,seasons:0};addAtt(p.owner,fi,-15);
  addLog(`I ${S.factions[fi].name} mettono l'assedio a ${PL[id].n}.`,p.owner===S.player?'war':'');
}
function fieldBattle(attArmy,defArmy){ // nessuna mura
  const A=attStr(attArmy)*rnd(.85,1.15),D=defStr(defArmy)*rnd(.85,1.15);
  if(A>D)return{win:true,aL:lose(attArmy,clamp(.1+.45*D/A,.1,.7)),dL:lose(defArmy,rnd(.55,.8))};
  return{win:false,aL:lose(attArmy,rnd(.45,.7)),dL:lose(defArmy,clamp(.4*A/D,0,.5))};
}

/* ---------- AI ---------- */
function aiTurn(fi){
  const F=S.factions[fi];if(!F.alive||F.role==='human')return;
  const passive=F.role==='passive';
  for(const id of owned(fi)){const p=S.places[id];if(p.siege)continue;
    aiBuild(fi,id);
    if(passive){ // casata passiva: amministra e si difende, non attacca mai
      const res=p.food/(p.pop*EAT);p.ration=res<1.2?0:1;p.tax=p.happy>55?1:0;
      p.alloc=res<2.5?{campi:40,castagni:40,pascolo:10,bosco:5,cava:5,edil:0}:p.proj?{campi:30,castagni:30,pascolo:10,bosco:8,cava:7,edil:15}:{campi:32,castagni:32,pascolo:10,bosco:13,cava:13,edil:0};
      if(F.denari>25&&tot(p.army)<p.pop*.12)recruit(fi,id,Math.random()<.3&&p.wood>=10?'b':'f',5);
      continue}
    const res=p.food/(p.pop*EAT);
    p.ration=res<1.2?0:(res>6&&p.happy<45?2:1);
    p.tax=p.happy>65?2:(p.happy>40?1:0);
    if(!p.proj&&p.walls<3&&Math.random()<.6)startWall(id);
    p.alloc=res<2.5?{campi:40,castagni:40,pascolo:10,bosco:5,cava:5,edil:0}:p.proj?{campi:30,castagni:30,pascolo:10,bosco:8,cava:7,edil:15}:{campi:32,castagni:32,pascolo:10,bosco:13,cava:13,edil:0};
    if(ADJ[id].some(n=>S.places[n].owner!==fi)){let i=0;
      while(i++<3&&F.denari>22&&tot(p.army)<p.pop*.45){const u=(p.wood>=10&&Math.random()<.35)?'b':(F.denari>70&&Math.random()<.2?'c':'f');if(!recruit(fi,id,u,5)&&!recruit(fi,id,'f',5))break}}
  }
  if(passive)return;
  for(const id in S.places){const q=S.places[id];if(q.siege&&q.siege.by===fi&&q.siege.seasons>=2&&attStr(q.siege.army)>defense(q)*1.15){const a=q.siege.army;q.siege=null;aiAssault(fi,a,id)}}
  // raduna le truppe dei castelli interni verso il confine
  const hostile=id=>ADJ[id].some(n=>{const o=S.places[n].owner;return o!==fi&&!peace(fi,o)});
  for(const id of owned(fi)){const p=S.places[id];if(p.siege||hostile(id))continue;
    const to=ADJ[id].find(n=>S.places[n].owner===fi&&!S.places[n].siege&&hostile(n));if(!to)continue;
    const mv={f:Math.floor(p.army.f*.6),b:Math.floor(p.army.b*.6),c:p.army.c};const a=S.places[to].army;
    p.army.f-=mv.f;p.army.b-=mv.b;p.army.c-=mv.c;a.f+=mv.f;a.b+=mv.b;a.c+=mv.c}
  if(Math.random()>Dz().atk)return;
  let best=null;
  for(const t in S.places){const q=S.places[t];if(q.owner===fi||q.siege||peace(fi,q.owner))continue;if(isHuman(q.owner)&&S.turn<Dz().grace)continue;
    const src=ADJ[t].filter(n=>S.places[n].owner===fi&&!S.places[n].siege);if(!src.length)continue;
    const av={f:0,b:0,c:0},parts=[];
    for(const n of src){const a=S.places[n].army,pt={f:Math.floor(a.f*.7),b:Math.floor(a.b*.7),c:a.c};parts.push([n,pt]);av.f+=pt.f;av.b+=pt.b;av.c+=pt.c}
    const A=attStr(av);if(A<12)continue;
    const ratio=A/defense(q);let mode=null;
    if(ratio>1.25)mode='a';else if(ratio>.6&&q.walls>=1)mode='s';
    if(mode){const sc=ratio+(isPassive(q.owner)?.15:0)+(mode==='a'?.2:0);if(!best||sc>best.sc)best={to:t,av,parts,mode,sc}}}
  if(best){for(const[n,pt]of best.parts){const a=S.places[n].army;a.f-=pt.f;a.b-=pt.b;a.c-=pt.c}
    if(best.mode==='a')aiAssault(fi,best.av,best.to);else startSiege(fi,best.av,best.to)}
}
function aiAssault(fi,army,id){if(isHuman(S.places[id].owner)){S.pending.push({fi,army,to:id});return}assault(fi,army,id)}

/* ---------- events ---------- */
function randomEvent(fi){
  const mine=owned(fi).filter(id=>!S.places[id].siege);if(!mine.length||Math.random()>.25)return;
  const id=pick(mine),p=S.places[id],n=PL[id].n,s=S.season;
  const ev=[
    ()=>{if(s!==1)return false;const l=Math.min(p.food,p.pop*.3);p.food-=l;addLog(`La grandine ha guastato il grano a ${n}: persi ${fmt(l)} staia di viveri.`,'war')},
    ()=>{const g=Math.round(rnd(8,20));S.factions[fi].denari+=g;addLog(`Una carovana di mulattieri diretta a Lucca paga il pedaggio a ${n}: ${g} denari.`,'good')},
    ()=>{if(p.food<p.pop*.3)return false;p.food-=p.pop*.1;p.happy=clamp(p.happy+8,0,100);addLog(`Festa del santo patrono a ${n}: la gente è contenta, ma la dispensa cala.`,'good')},
    ()=>{if(p.proj){p.proj.prog=Math.max(0,p.proj.prog-20)}else p.stone=Math.max(0,p.stone-15);addLog(`Una frana dopo le piogge ha travolto la mulattiera di ${n}: lavori rallentati.`,'war')},
    ()=>{if(s!==2)return false;p.food+=p.pop*.4;addLog(`Annata d'oro per le castagne a ${n}: i metati sono pieni.`,'good')},
  ];
  for(let i=0;i<5;i++){if(pick(ev)()!==false)return}
}

/* ---------- season ---------- */
function endTurn(){
  if(!S||S.over||UI.moveFrom||B)return;
  if(S.pending.length){cont();return}
  const nx=nextHumanAfter(S.cur);
  if(nx!=null){S.cur=S.player=nx;UI.sel=owned(nx)[0]||UI.sel;save();renderAll();handoffModal();return}
  resolveSeason();
}
function resolveSeason(){
  buf=[];sfx('bell');
  for(let fi=0;fi<S.factions.length;fi++)aiTurn(fi);
  for(const id in S.places){const q=S.places[id];if(q.siege){q.siege.seasons++;if(S.season===3)lose(q.siege.army,.05)}}
  for(const id in S.places)resolvePlace(id);
  for(const id in S.places){const q=S.places[id];if(q.siege&&q.food<=0){const g=q.siege;q.siege=null;addLog(`${PL[id].n}, affamata, apre le porte agli assedianti.`,isHuman(g.by)?'good':(isHuman(q.owner)?'war':''));capture(id,g.by,g.army)}}
  for(let fi=0;fi<S.factions.length;fi++){const F=S.factions[fi];if(!F.alive)continue;
    const armies=[];for(const id in S.places){const q=S.places[id];if(q.owner===fi)armies.push(q.army);if(q.siege&&q.siege.by===fi)armies.push(q.siege.army)}
    const cost=armies.reduce((s,a)=>s+a.f*UNITS.f.up+a.b*UNITS.b.up+a.c*UNITS.c.up,0);
    if(F.denari>=cost)F.denari-=cost;else{F.denari=0;armies.forEach(a=>lose(a,.12));if(isHuman(fi))addLog(`Il tesoro dei ${F.name} non basta a pagare le soldatesche: alcuni disertano.`,'war')}}
  for(const id in S.places){const q=S.places[id];
    if(q.owner>=0&&q.happy<15&&!q.siege&&Math.random()<(q.bld&&q.bld.chiesa?.15:.35)){const o=q.owner;q.owner=-1;lose(q.army,.5);q.happy=40;addLog(`Rivolta a ${PL[id].n}: la comunità caccia gli uomini dei ${S.factions[o].name}.`,isHuman(o)?'war':'')}
    if(q.owner<0&&!q.siege){q.army.f=Math.min(q.g0.f,q.army.f+1)}}
  for(let fi=0;fi<S.factions.length;fi++){const F=S.factions[fi];if(!F.alive)continue;
    const has=owned(fi).length||Object.values(S.places).some(q=>q.siege&&q.siege.by===fi);
    if(!has){F.alive=false;addLog(`I ${F.name} hanno perso ogni castello: la casata è finita.`,isHuman(fi)?'war':'good')}}
  S.turn++;S.season=(S.season+1)%4;if(S.season===0)S.year++;
  for(const fi of aliveHumans())randomEvent(fi);
  aiDiplomacy();genEvents();
  S.fodro=S.season===3?aliveHumans().filter(fi=>S.factions[fi].denari>0):[];
  const end=checkEnd();
  const first=aliveHumans()[0];if(first!=null){S.cur=S.player=first;if(!UI.sel||S.places[UI.sel]&&S.places[UI.sel].owner!==first)UI.sel=owned(first)[0]||UI.sel}
  save();renderAll();
  showReport(end);
}

const DIFF={facile:{n:'Facile',aiDen:40,pDen:90,atk:.3,grace:8,aiProd:.95,aiTax:1.2},normale:{n:'Normale',aiDen:60,pDen:60,atk:.45,grace:4,aiProd:1.05,aiTax:1.6},difficile:{n:'Difficile',aiDen:90,pDen:50,atk:.6,grace:2,aiProd:1.15,aiTax:2.1}};
function Dz(){return DIFF[S.diff]||DIFF.normale}
function isHuman(fi){return fi>=0&&S.factions[fi].role==='human'}
function aliveHumans(){return (S.humans||[S.player]).filter(fi=>S.factions[fi].alive)}
function multi(){return (S.humans||[]).length>1}
function nextHumanAfter(fi){const o=S.humans||[fi];for(let j=o.indexOf(fi)+1;j<o.length;j++)if(S.factions[o[j]].alive)return o[j];return null}
function migrate(s){
  s.pending=s.pending||[];s.rel=s.rel||{};s.att=s.att||{};s.events=s.events||{};s.fodro=s.fodro||[];s.offers=s.offers||[];s.inf=s.inf||{};s.hist=s.hist||[];
  s.diff=s.diff||'normale';s.tut=s.tut||{on:false,done:[]};
  s.factions.forEach((F,i)=>{if(!F.role)F.role=i===s.player?'human':'ai'});
  s.humans=s.humans||s.factions.map((F,i)=>F.role==='human'?i:-1).filter(i=>i>=0);
  if(s.cur==null)s.cur=s.player;
  for(const id in s.places){const p=s.places[id];p.bld=p.bld||{};if(p.bq===undefined)p.bq=null}
  return s;
}
function pay(fi,amt,check){const F=S.factions[fi];if(check&&F.denari<amt)return false;F.denari=Math.max(0,F.denari-amt);return true}
function allHappy(fi,v){for(const id of owned(fi)){const p=S.places[id];p.happy=clamp(p.happy+v,0,100)}}
function allFood(fi,fr){for(const id of owned(fi)){const p=S.places[id];p.food=Math.max(0,p.food+p.pop*fr)}}
function allPop(fi,fr){for(const id of owned(fi))S.places[id].pop*=1-fr}
function richest(fi){return owned(fi).sort((a,b)=>S.places[b].food-S.places[a].food)[0]}
function takeMen(fi,u,n){let left=n;for(const id of owned(fi).sort((a,b)=>S.places[b].army[u]-S.places[a].army[u])){const a=S.places[id].army,k=Math.min(a[u],left);a[u]-=k;left-=k;if(!left)break}}
function nbOwner(fi,id){const o=ADJ[id].find(x=>S.places[x].owner!==fi&&S.places[x].owner>=0);return o?S.places[o].owner:-1}

  chiesa:{n:'Chiesa',fx:'+2 di umore a stagione, rivolte più rare',wood:30,stone:60,den:40}
};
function canBuild(fi,id,k){const p=S.places[id],X=BUILD[k];return !p.bld[k]&&!p.bq&&!p.siege&&p.wood>=X.wood&&p.stone>=X.stone&&S.factions[fi].denari>=X.den}
function build(fi,id,k){if(!canBuild(fi,id,k))return false;const p=S.places[id],X=BUILD[k];p.wood-=X.wood;p.stone-=X.stone;S.factions[fi].denari-=X.den;p.bq=k;return true}
function aiBuild(fi,id){if(Math.random()>.25||S.factions[fi].role==='passive')return;for(const k of['mulino','metato','chiesa','fucina'])if(canBuild(fi,id,k)&&S.factions[fi].denari>BUILD[k].den+30){build(fi,id,k);return}}
function unitCost(id,u){return Math.round(UNITS[u].den*((S.places[id].bld||{}).fucina&&u!=='f'?.7:1)*10)/10}

/* ---------- diplomazia ---------- */
const TREATY={tregua:'Tregua',alleanza:'Alleanza',matrimonio:'Matrimonio'};
const rk=(a,b)=>a<b?a+'-'+b:b+'-'+a;
function treaty(a,b){if(a<0||b<0||a===b)return null;const k=rk(a,b),r=S.rel[k];if(!r)return null;if(r.until!=null&&S.turn>=r.until){delete S.rel[k];return null}return r}
function peace(a,b){return !!treaty(a,b)}
function att(a,b){return S.att[a+'>'+b]||0}
function addAtt(a,b,v){if(a<0||b<0||a===b)return;S.att[a+'>'+b]=clamp(att(a,b)+v,-100,100)}
function power(fi){let s=0;for(const id in S.places){const q=S.places[id];if(q.owner===fi)s+=defStr(q.army)+q.pop*.04;if(q.siege&&q.siege.by===fi)s+=defStr(q.siege.army)}return s}
function seasonOfTurn(t){const d=t-S.turn,s=(S.season+d)%4,y=S.year+Math.floor((S.season+d)/4);return SEASONS[s].toLowerCase()+' '+y}
function makeTreaty(a,b,t){
  S.rel[rk(a,b)]={t,until:t==='tregua'?S.turn+8:null};
  for(const id in S.places){const q=S.places[id];if(q.siege&&((q.siege.by===a&&q.owner===b)||(q.siege.by===b&&q.owner===a))){const g=q.siege;q.siege=null;retreat(g.army,g.by,id,true)}}
  S.pending=S.pending.filter(x=>{const o=S.places[x.to].owner;if((x.fi===a&&o===b)||(x.fi===b&&o===a)){retreat(x.army,x.fi,x.to,true);return false}return true});
  addAtt(a,b,15);addAtt(b,a,15);addLog(`${TREATY[t]} tra i ${S.factions[a].name} e i ${S.factions[b].name}.`,'good');
}
function breakTreaty(a,b){delete S.rel[rk(a,b)];S.inf[a]=(S.inf[a]||0)+1;S.factions.forEach((G,j)=>{if(j!==a)addAtt(j,a,-15)});addAtt(b,a,-40);
  addLog(`I ${S.factions[a].name} rompono il patto con i ${S.factions[b].name}. In tutta la valle se ne parla male.`,'war')}
function aiAccepts(ai,from,kind){const mine=power(ai),his=power(from);
  let s=att(ai,from)+(his>mine*1.2?20:his<mine*.7?-20:0)-(S.inf[from]||0)*15+{tregua:15,alleanza:-5,matrimonio:5}[kind];return s+rnd(-20,20)>10}
function passiveAccepts(fi,id,kind){const q=S.places[id],near=ADJ[id].filter(n=>S.places[n].owner===fi).reduce((s,n)=>s+attStr(S.places[n].army),0),D=defense(q);
  let s=att(q.owner,fi)-(S.inf[fi]||0)*15;s+=kind==='protezione'?(near>D*1.3?40:near>D*.8?10:-20):25;return s+rnd(-20,20)>15}
function vassalize(fi,id,how){const q=S.places[id],prev=q.owner;q.owner=fi;q.happy=Math.max(q.happy,50);q.tax=1;q.ration=1;q.siege=null;
  if(prev>=0&&!owned(prev).length)S.factions[prev].alive=false;
  addLog(`${PL[id].n} ${how==='matrimonio'?'si lega con un matrimonio':'accetta la protezione'} e giura fedeltà ai ${S.factions[fi].name}.`,'good')}
function aiDiplomacy(){
  for(let a=0;a<S.factions.length;a++){const A=S.factions[a];if(!A.alive||A.role!=='ai')continue;
    for(const h of aliveHumans()){if(S.offers.some(o=>o.from===a&&o.to===h))continue;const tr=treaty(a,h);
      if(!tr&&power(a)<power(h)*.7&&Math.random()<.12)S.offers.push({from:a,to:h,t:'tregua'});
      else if((!tr||tr.t==='tregua')&&att(a,h)>35&&Math.random()<.1)S.offers.push({from:a,to:h,t:'alleanza'})}}
  for(const k in S.att)S.att[k]*=.95;
  for(const k in S.rel){const r=S.rel[k];if(r.until!=null&&S.turn>=r.until){const[a,b]=k.split('-').map(Number);delete S.rel[k];addLog(`La tregua tra i ${S.factions[a].name} e i ${S.factions[b].name} è scaduta.`,(isHuman(a)||isHuman(b))?'war':'')}}
}
const moodWord=a=>a>40?'amico':a>15?'cordiale':a>-15?'neutrale':a>-40?'freddo':'ostile';
function diploModal(msg){
  const me=S.player,F=S.factions[me];
  const bt=(act,j,l,dis)=>`<button class="btn" type="button" data-act="${act}" data-j="${j}" ${dis?'disabled':''}>${l}</button>`;
  const rows=S.factions.map((G,j)=>{if(j===me||!G.alive)return '';
    const tr=treaty(me,j),pas=G.role==='passive',hum=G.role==='human',cs=CASTLES.filter(id=>S.places[id].owner===j);
    const st=tr?`${TREATY[tr.t]}${tr.until!=null?` fino a ${seasonOfTurn(tr.until)}`:''}`:(pas?'neutrale':'in guerra');
    let acts='';
    if(pas){const id=owned(j)[0];if(id&&ADJ[id].some(n=>S.places[n].owner===me))acts+=bt('dp-prot',j,'Offri protezione');
      acts+=bt('dp-marry',j,'Matrimonio (dote 80)',F.denari<80)+bt('dp-gift',j,'Dono di 20 denari',F.denari<20)}
    else{if(!tr)acts+=bt('dp-tregua',j,'Proponi tregua');if(!tr||tr.t==='tregua')acts+=bt('dp-alleanza',j,'Proponi alleanza');
      if(!tr||tr.t!=='matrimonio')acts+=bt('dp-marry',j,'Matrimonio (dote 60)',F.denari<60);if(!hum)acts+=bt('dp-gift',j,'Dono di 20 denari',F.denari<20);
      if(tr&&tr.t!=='matrimonio')acts+=bt('dp-break',j,'Rompi il patto')}
    return `<div class="dp"><div class="dph"><i style="background:${col(j)}"></i><b>${G.name}</b>${hum?'<span class="badge h">giocatore</span>':pas?'<span class="badge">passiva</span>':''}
      <span class="k">${cs.length} ${cs.length===1?'castello':'castella'} · ${st}${hum?'':' · '+moodWord(att(j,me))}</span></div><div class="actions">${acts}</div></div>`}).join('');
  openModal(`<div class="advcard">${portrait('notaio')}<div><h2>Diplomazia</h2><span class="kind" style="color:var(--ink-2)">Ser Lapo tiene i registri dei patti</span>
    <p class="quote">“Una buona dote vale più di cento balestre, signore.”</p>${msg?`<div class="alert mine">${msg}</div>`:''}</div></div>
    <div class="dps">${rows}</div>
    <p class="note">La tregua dura due anni; alleanze e matrimoni durano finché qualcuno non li rompe. Chi rompe un patto si fa una cattiva fama e le altre casate accetteranno meno volentieri le sue proposte. Le casate passive si possono convincere a giurare fedeltà: con la protezione, se i tuoi eserciti vicini fanno paura, o con un matrimonio.</p>
    <div class="actions"><button class="btn primary" type="button" data-act="close">Chiudi</button></div>`);
}
function diploAct(kind,j){
  const me=S.player,G=S.factions[j],F=S.factions[me];let msg='';
  if(kind==='gift'){pay(me,20);addAtt(j,me,G.role==='passive'?15:12);msg=`I ${G.name} gradiscono il dono.`}
  else if(kind==='break'){breakTreaty(me,j);msg=`Hai rotto il patto con i ${G.name}. Le altre casate se ne ricorderanno.`}
  else if(G.role==='passive'){const id=owned(j)[0];if(!id)return;const how=kind==='marry'?'matrimonio':'protezione';
    if(how==='matrimonio')pay(me,80);
    if(passiveAccepts(me,id,how)){vassalize(me,id,how);msg=`${PL[id].n} giura fedeltà alla tua casata.`;sfx('fanfare')}
    else{addAtt(j,me,-5);if(how==='matrimonio')F.denari+=80;msg=`I ${G.name} rifiutano.${how==='matrimonio'?' La dote ti viene restituita.':''}`}}
  else{const t={tregua:'tregua',alleanza:'alleanza',marry:'matrimonio'}[kind];const dote=t==='matrimonio'?60:0;
    if(dote)pay(me,dote);
    if(G.role==='human'){S.offers.push({from:me,to:j,t,dote});msg=`La proposta è partita: i ${G.name} risponderanno al loro turno.`}
    else if(aiAccepts(j,me,t)){makeTreaty(me,j,t);if(t==='matrimonio')addAtt(j,me,30);msg=`I ${G.name} accettano: ${TREATY[t].toLowerCase()}.`;sfx('fanfare')}
    else{addAtt(j,me,-3);if(dote)F.denari+=dote;msg=`I ${G.name} rifiutano la proposta.`}}
  save();renderAll();diploModal(msg);
}
function offerModal(of){
  const A=S.factions[of.from];
  const what={tregua:'una tregua di due anni',alleanza:'un\'alleanza',matrimonio:`un matrimonio tra le casate, con una dote di ${of.dote||0} denari`}[of.t];
  openModal(`<div class="advcard">${portrait('notaio')}<div><h2>Proposta dei ${A.short}</h2>

    <div class="actions"><button class="btn primary" type="button" data-act="offer-yes">Accetta</button><button class="btn" type="button" data-act="offer-no">Rifiuta</button></div></div></div>`);
}

function projFood(p,id,alloc,n=4){let food=p.food;const q={...p,alloc:alloc||p.alloc},need=p.pop*EAT*RATION[p.ration].m;
  for(let i=0;i<n;i++){food+=prod(q,id,(S.season+i)%4).food-need;if(food<0)return{out:i,food}}return{out:-1,food}}
function recAlloc(p,id){const d=PL[id],need=p.pop*EAT*RATION[p.ration].m;
  for(let sh=30;sh<=95;sh+=5){const fs=sh-10,campi=Math.round(fs*d.gr/(d.gr+d.ca)/5)*5,cast=fs-campi,rest=100-sh;
    const edil=p.proj?Math.min(rest,15):0,r2=rest-edil,cava=Math.round(r2*(p.walls<3?.55:.4)/5)*5,bosco=r2-cava;
    const a={campi,castagni:cast,pascolo:10,bosco,cava,edil};const pf=projFood(p,id,a);if(pf.out<0&&pf.food>=need*.8)return a}
  return{campi:45,castagni:45,pascolo:10,bosco:0,cava:0,edil:0}}
function upkeepOf(a){return a.f*UNITS.f.up+a.b*UNITS.b.up+a.c*UNITS.c.up}
function advice(k){
  const out=[],all=owned(S.player),mine=all.filter(id=>!S.places[id].siege),F=S.factions[S.player],n=id=>PL[id].n;
  const add=(l,txt,go)=>out.push({l,txt,go});
  if(k==='fattore'){
    for(const id of mine){const p=S.places[id],pf=projFood(p,id);
      if(pf.out>=0)add('bad',`A ${n(id)} il granaio si svuota ${pf.out===0?'già questa stagione':'in '+SEASONS[(S.season+pf.out)%4].toLowerCase()}. Servono più braccia nei campi e nei castagneti.`,id);
      const u=sumAlloc(p.alloc);if(u<100)add('warn',`A ${n(id)} il ${100-u}% della gente è senza lavoro.`,id);
      if(!p.proj&&p.alloc.edil>0)add('warn',`A ${n(id)} ci sono muratori senza cantiere.`,id)}
    add('ok',['Primavera: i granai sono ai minimi e il grano rende poco. Si tiene duro fino all\'estate.','Estate: è la stagione del grano. Le braccia nei campi adesso valgono doppio.','Autunno: tempo di castagne. Riempite i castagneti, poi i metati.','Inverno: i campi dormono. Spostate gente al bosco e alla cava.'][S.season]);
  }
  if(k==='capitano'){
    for(const id of all){const p=S.places[id];let w=null;
      for(const t of ADJ[id]){const q=S.places[t];if(q.owner===S.player||isPassive(q.owner)||peace(S.player,q.owner))continue;const a=attStr(q.army)*.7;if(!w||a>w.a)w={a,fi:q.owner,t}}
      const D=defense(p);if(w&&w.a>D*.9)add(w.a>D*1.4?'bad':'warn',`${n(id)} è esposta: da ${n(w.t)} i ${S.factions[w.fi].name} possono muovere circa ${Math.max(5,Math.round(w.a/1.15/5)*5)} uomini.`,id)}
    for(const id in S.places){const q=S.places[id];if(q.siege&&q.siege.by===S.player)add('ok',`L'assedio di ${n(id)} dura da ${q.siege.seasons} stagioni.`,id)}
    for(const id of mine){const p=S.places[id],av=attStr({f:Math.floor(p.army.f*.7),b:Math.floor(p.army.b*.7),c:p.army.c});if(av<10)continue;
      for(const t of ADJ[id]){const q=S.places[t];if(q.owner===S.player||q.siege)continue;const D=defense(q);
        if(av>D*1.3)add('ok',`Da ${n(id)} potete prendere ${n(t)}: difesa stimata ${Math.round(D)}, la vostra forza ${Math.round(av)}.`,t)}}
    if(!out.length)add('ok','Nessuna minaccia vicina. È il momento di arruolare balestrieri: contro le mura servono.');
  }
  if(k==='pievano'){
    for(const id of all){const p=S.places[id];
      if(p.siege)add('bad',`${n(id)} è assediata: preghiamo, e mandate soccorsi.`,id);
      if(p.happy<22)add('bad',`A ${n(id)} si parla di rivolta. Abbassate la decima o allargate le razioni.`,id);
      else if(p.happy<40)add('warn',`A ${n(id)} la gente è scontenta.`,id);
      if(p.tax===3)add('warn',`La decima alta a ${n(id)} pesa sulle famiglie.`,id);
      if(p.ration===0)add('warn',`Le razioni scarse a ${n(id)} non piacciono a nessuno.`,id)}
    if(!out.length)add('ok','Le vostre genti sono quiete. Una festa ogni tanto non guasta.');
  }
  if(k==='notaio'){let inc=0,up=0;
    for(const id in S.places){const q=S.places[id];if(q.owner===S.player){inc+=q.pop*TAX[q.tax].r;up+=upkeepOf(q.army)}if(q.siege&&q.siege.by===S.player)up+=upkeepOf(q.siege.army)}
    add(inc<up?(F.denari<up*3?'bad':'warn'):'ok',`Entrate circa ${fmt(inc)} denari a stagione, paghe dei soldati ${fmt(up)}.`);
    if(S.season===2){add('warn',`A fine autunno Lucca chiederà il fodro, circa ${fmt(Math.max(10,F.denari*.15))} denari.`);add('ok','Con le castagne i prezzi scendono: a Pescia i viveri costano poco.')}
    if(S.season===0){const rich=mine.filter(id=>S.places[id].food>S.places[id].pop*EAT*6);add('ok',rich.length?`In primavera i viveri valgono di più: ${rich.map(n).join(', ')} ne ha da vendere.`:'In primavera i viveri a Pescia costano cari: meglio non comprarne ora.')}
    for(const id of mine){const p=S.places[id];if(!p.proj&&p.walls<3){const W=WALL[p.walls+1];if(p.stone<W.stone&&p.stone>W.stone*.5)add('ok',`Per le mura di ${n(id)} mancano ${fmt(W.stone-p.stone)} pietre: a Pescia si comprano.`,id)}}
  }
  const ord={bad:0,warn:1,ok:2};return out.sort((a,b)=>ord[a.l]-ord[b.l]).slice(0,6);
}

const diff=(a,b)=>({f:Math.max(0,a.f-b.f),b:Math.max(0,a.b-b.b),c:Math.max(0,a.c-b.c)});
function checkEnd(){
  for(const fi of S.humans||[S.player]){const alive=owned(fi).length||Object.values(S.places).some(q=>q.siege&&q.siege.by===fi);if(!alive)S.factions[fi].alive=false}
  const owner=S.places[CASTLES[0]].owner,all=owner>=0&&CASTLES.every(id=>S.places[id].owner===owner);
  if(all&&isHuman(owner)){S.over='win';S.winner=owner}
  else if(all||!aliveHumans().length){S.over='lose';S.winner=all?owner:null}
  return S.over||null;
}

function playerAssault(army,to){

}
function openBattle(cfg){
  BCOL={ink:cssv('--ink'),paper:cssv('--paper'),p2:cssv('--paper-2'),h1:cssv('--h1'),h2:cssv('--h2'),h3:cssv('--h3'),h4:cssv('--h4'),stone:cssv('--stone'),stone2:cssv('--stone-2'),wood:cssv('--wood'),acc:cssv('--accent'),bad:cssv('--bad')};

  B={cfg,walls:cfg.walls||0,wallY:205,gateX:BW/2,gateW:64,sq:[],bolts:[],parts:[],orders:[],t:0,running:false,speed:1,auto:false,aiT:0,over:false,win:false,endWait:0,snd:{},col:[pc,ec],hudT:0,box:null};
  B.gate0=B.gateHp=B.walls?110*B.walls:0;

  deploy(cfg.eArmy,1,cfg.playerAtt?'def':'att',cfg.playerAtt?(cfg.militia||0):0,cfg.eHpm||1);

function sizeCanvas(){const cv=$('#bcv'),w=cv.getBoundingClientRect().width||BW,dpr=window.devicePixelRatio||1;cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr*BH/BW)}

function bsfx(n,gap){if(B.auto)return;const now=performance.now();if((B.snd[n]||0)>now)return;B.snd[n]=now+gap*1000;sfx(n)}
function hurt(o,d){o.hp-=d;o.flash=.12;o.men=Math.max(0,Math.ceil(o.hp/(BU[o.t].hp*(o.hpm||1))-1e-6));if(o.hp<=0){o.hp=0;o.men=0}
  if(!B.auto&&Math.random()<.15)B.parts.push({x:o.x+rnd(-8,8),y:o.y+rnd(-6,6),r:2,t:1})}
function clampWall(s){if(!B.walls)return;const inGate=B.gateHp<=0&&Math.abs(s.x-B.gateX)<B.gateW/2-4;
  if(s.in){if(s.y>B.wallY-6){if(inGate){if(s.y>B.wallY+14)s.in=false}else s.y=B.wallY-6}}
  else if(s.y<B.wallY+16){if(inGate){if(s.y<B.wallY-6)s.in=true}else s.y=B.wallY+16}}
function route(s,gx,gy){if(!B.walls)return[gx,gy];const ti=gy<B.wallY;if(s.in===ti)return[gx,gy];

function fire(s,o){const d=dist(s,o);for(let k=0;k<Math.min(3,s.men);k++)B.bolts.push({x:s.x+rnd(-6,6),y:s.y+rnd(-4,4),tx:o.x+rnd(-6,6),ty:o.y+rnd(-5,5),t:0,T:d/430+k*.04,o:o.id,dmg:k===0?BU.b.shot*s.men:0});bsfx('twang',.12)}

}
function autoEngage(s){if(s.target!=null||s.tx!=null)return;const o=nearest(s,liveS(1-s.side),BU[s.t].ar,s.t!=='b');if(o)s.target=o.id}
function bStep(dt){
  B.t+=dt;B.aiT-=dt;
  if(B.aiT<=0){B.aiT=.4;for(const s of B.sq){if(s.men<=0)continue;if(s.side===1||B.auto)aiSquad(s);else autoEngage(s)}}
  for(const s of B.sq){if(s.men<=0)continue;const U=BU[s.t];s.flash=Math.max(0,s.flash-dt);
    let tg=null;if(s.target==='gate'){if(B.gateHp<=0)s.target=null}else if(s.target!=null){tg=B.sq[s.target];if(tg.men<=0){s.target=null;tg=null}}
    // mischia
    let foe=null,fd=1e9;for(const o of B.sq){if(o.side===s.side||o.men<=0)continue;const d=dist(s,o);if(d<rad(s)+rad(o)+U.rng&&reach(s,o)&&(o===tg?-1:d)<fd){fd=o===tg?-1:d;foe=o}}
    if(foe){let d=U.dmg*s.men*dt;if(s.t==='c'&&s.charge>0){d*=2.2;s.charge-=dt}if(s.t==='c'&&foe.t==='b')d*=1.5;if(s.t==='f'&&foe.t==='c')d*=1.4;hurt(foe,d);bsfx('hit',.22);continue}

      if(sh){if(s.cd<=0){fire(s,sh);s.cd=U.reload*(.85+Math.random()*.3)}if(s.tx==null)continue}}
    // movimento
    let gx=null,gy=null,gate=s.target==='gate';
    if(gate){gx=B.gateX;gy=B.wallY+22}else if(tg){gx=tg.x;gy=tg.y;if(s.t==='c'&&dist(s,tg)>80)s.charge=1.4}else if(s.tx!=null){gx=s.tx;gy=s.ty}
    if(gx==null)continue;
    let[rx,ry]=route(s,gx,gy);
    if(B.walls&&B.gateHp>0&&!s.in&&s.t!=='b'&&rx===B.gateX&&ry===B.wallY+22)gate=true;
    if(gate&&B.gateHp>0&&Math.hypot(s.x-B.gateX,s.y-(B.wallY+22))<rad(s)+16){B.gateHp=Math.max(0,B.gateHp-U.dmg*s.men*dt*(s.t==='c'?.5:1));bsfx('thud',.5);if(B.gateHp<=0){bsfx('clash',1);addParts(B.gateX,B.wallY,12)}continue}

  // dardi
  for(const b of B.bolts){b.t+=dt;if(b.t>=b.T&&!b.done){b.done=true;if(b.dmg){const o=B.sq[b.o];if(o.men>0&&Math.random()<.8){let d=b.dmg;if(B.walls&&o.in&&o.y>B.wallY-20)d*=.5;if(o.t==='c')d*=.8;hurt(o,d)}}}}

    if(!B.auto)sfx(B.win?'fanfare':'setback')}
}
function addParts(x,y,n){for(let i=0;i<n;i++)B.parts.push({x:x+rnd(-25,25),y:y+rnd(-8,8),r:2+Math.random()*3,t:1})}

function drawField(){

  const y=B.wallY,gx=B.gateX,gw=B.gateW;g.strokeStyle=BCOL.ink;g.lineWidth=1.2;
  const seg=(a,b)=>{g.fillStyle=BCOL.stone;g.fillRect(a,y-11,b-a,22);g.strokeRect(a,y-11,b-a,22);for(let x=a+4;x<b-8;x+=14){g.fillRect(x,y+11,8,6);g.strokeRect(x,y+11,8,6)}};

const AU={ctx:null,mus:null,sfx:null,wet:null,nb:null,music:true,fx:true,timer:null,drone:null,q:[],next:0,drumT:0,beat:0,deg:7,ph:0};

function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  let c;try{c=new C()}catch(e){return}AU.ctx=c;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.connect(c.destination);
  const master=c.createGain();master.gain.value=.85;master.connect(comp);
  const len=Math.floor(c.sampleRate*2.4),ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}
  const conv=c.createConvolver();conv.buffer=ir;AU.wet=c.createGain();AU.wet.gain.value=.26;AU.wet.connect(conv);conv.connect(master);
  AU.nb=c.createBuffer(1,c.sampleRate,c.sampleRate);const nd=AU.nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  AU.mus=c.createGain();AU.mus.gain.value=.5;AU.mus.connect(master);AU.mus.connect(AU.wet);
  AU.sfx=c.createGain();AU.sfx.gain.value=AU.fx?.8:0;AU.sfx.connect(master);AU.sfx.connect(AU.wet);

function osc(type,f,t,dest){const o=AU.ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(dest)o.connect(dest);return o}

function pluck(t,f,vol,dec,dest){const c=AU.ctx,g=envGain(t,.004,vol,dec,dest),lp=c.createBiquadFilter();lp.type='lowpass';
  lp.frequency.setValueAtTime(Math.min(12000,f*7),t);lp.frequency.exponentialRampToValueAtTime(f*1.4,t+dec*.6);lp.connect(g);
  const o=osc('triangle',f,t,lp),g2=c.createGain();g2.gain.value=.22;g2.connect(lp);const o2=osc('sawtooth',f*1.003,t,g2);
  o.start(t);o2.start(t);o.stop(t+dec+.1);o2.stop(t+dec+.1)}
function flute(t,f,dur,vol,dest){const c=AU.ctx,g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.07);
  g.gain.setValueAtTime(vol,t+Math.max(.08,dur-.08));g.gain.exponentialRampToValueAtTime(.0001,t+dur+.14);g.connect(dest);

  o.start(t);l.start(t);o.stop(t+dur+.2);l.stop(t+dur+.2)}
function drum(t,vol,dest,low=1){const c=AU.ctx,g=envGain(t,.003,vol,.35,dest),o=osc('sine',110*low,t,g);o.frequency.exponentialRampToValueAtTime(46*low,t+.25);o.start(t);o.stop(t+.45);
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;const ng=envGain(t,.002,vol*.35,.06,dest);bp.connect(ng);noise(t,.08,bp)}

// modo musicale per stagione: dorico in primavera e autunno, misolidio d'estate, eolio d'inverno
const MODES=[[0,2,3,5,7,9,10],[0,2,4,5,7,9,10],[0,2,3,5,7,9,10],[0,2,3,5,7,8,10]];
const ROOT=146.83;

const RHY=[[1,1,1,1,2,2],[.5,.5,1,1,1,2,2],[1.5,.5,1,1,2,2],[1,.5,.5,1,1,1,1,2],[2,1,1,2,2]];
function phrase(){const r=pick(RHY);AU.ph++;const inst=AU.ph%4===3?'flute':'lute',out=[];
  r.forEach((d,i)=>{let deg;if(i===r.length-1)deg=pick([7,11,14]);else{AU.deg=clamp(AU.deg+pick([-2,-1,-1,1,1,2,0,3,-3]),4,16);deg=AU.deg}
    out.push({deg:(Math.random()<.08&&i<r.length-1)?null:deg,dur:d,inst})});
  AU.deg=out[out.length-1].deg;return out}
function schedule(){const c=AU.ctx;if(!c||!AU.music)return;const m=S?S.season:0,bl=60/(m===3?60:m===1?84:72);
  while(AU.next<c.currentTime+.3){if(!AU.q.length)AU.q=phrase();const n=AU.q.shift();
    if(n.deg!=null){const f=degF(n.deg,m);if(n.inst==='lute')pluck(AU.next,f,.15,Math.min(1.8,n.dur*bl*1.6),AU.mus);else flute(AU.next,f*2,n.dur*bl*.92,.07,AU.mus)}
    AU.next+=n.dur*bl}
  while(AU.drumT<c.currentTime+.3){const b=AU.beat%4;
    if(b===0){drum(AU.drumT,.2,AU.mus);pluck(AU.drumT,(AU.beat%8<4)?ROOT/2:ROOT/2*1.4983,.13,2.2,AU.mus)}
    else if(b===2)drum(AU.drumT,.1,AU.mus);else tek(AU.drumT+bl*.5,.045,AU.mus);

function startDrone(){const c=AU.ctx,t=c.currentTime,g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.03,t+2.5);

  march(){const t=AU.ctx.currentTime;for(let i=0;i<6;i++)tek(t+i*.18,.12,AU.sfx);drum(t,.25,AU.sfx,.9)},
  twang(){const c=AU.ctx,t=c.currentTime,o=osc('sawtooth',520,t,envGain(t,.002,.1,.12,AU.sfx));o.frequency.exponentialRampToValueAtTime(140,t+.1);o.start(t);o.stop(t+.15);
    const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=3000;hp.connect(envGain(t,.002,.07,.05,AU.sfx));noise(t,.06,hp)},
  hit(){const c=AU.ctx,t=c.currentTime,bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2600+Math.random()*1600;bp.Q.value=3;bp.connect(envGain(t,.002,.16,.09,AU.sfx));noise(t,.1,bp);
    const o=osc('square',1700+Math.random()*900,t,envGain(t,.002,.018,.15,AU.sfx));o.start(t);o.stop(t+.18)},
  thud(){drum(AU.ctx.currentTime,.45,AU.sfx,.55)},
  fanfare(){SFX.horn([[293.7,0,.25],[370,.25,.25],[440,.5,.25],[587.3,.75,1.1]])},
  setback(){SFX.horn([[196,0,.5],[174.6,.45,.9]])},
  dirge(){SFX.horn([[220,0,.9],[207.7,.9,.9],[146.8,1.8,1.6]])},
  siege(){SFX.horn([[220,0,.4],[220,.5,.4],[293.7,1,1]])}
};
function sfx(n,a,delay=0){if(!AU.ctx||!AU.fx)return;const run=()=>{try{SFX[n](a)}catch(e){}};delay?setTimeout(run,delay):run()}
document.addEventListener('pointerdown',audioInit,true);
document.addEventListener('keydown',audioInit,true);
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend().catch(()=>{});else AU.ctx.resume().catch(()=>{})});
$('#musBtn').addEventListener('click',()=>{AU.music=!AU.music;savePrefs();syncSndBtns();audioInit();if(AU.music)startMusic();else stopMusic()});
$('#fxBtn').addEventListener('click',()=>{AU.fx=!AU.fx;savePrefs();syncSndBtns();if(AU.sfx)AU.sfx.gain.value=AU.fx?.8:0;sfx('tick')});
syncSndBtns();

/* ---------- boot ---------- */
drawLand();
function start(data){
  if(data&&data.S&&data.S.v>=2){S=migrate(data.S);UI=data.UI||UI;renderAll();return}
  newGame('medicina');renderAll();pickerModal();
}
window.claude?.hot?.snapshot?.(()=>({S,UI}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
